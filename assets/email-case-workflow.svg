<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="970" viewBox="0 0 1000 970" role="img" aria-labelledby="title desc">
<title id="title">邮件审核与案件协作工具 — 流程示意</title>
<desc id="desc">邮件与附件、订单与内部档案汇入会话归并与案件时间线，依次进入AI 回复草稿，依次进入人工审核与确认发送，依次进入发送记录与邮箱对账，依次进入案件进度与飞书协作。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#8A9E95"/></marker></defs>
<rect width="1000" height="970" fill="#FFFFFF"/>
<g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<rect x="48" y="38" width="6" height="36" rx="3" fill="#214D43"/>
<text x="72" y="66" fill="#203A33" font-size="30" font-weight="700">邮件审核与案件协作工具</text>
<text x="72" y="103" fill="#65756F" font-size="19">以案件组织邮件，保留人工审核与发送确认</text>
<rect x="830" y="40" width="122" height="36" rx="18" fill="#EEF4F0"/>
<text x="891" y="65" text-anchor="middle" fill="#214D43" font-size="18" font-weight="600">流程示意</text>
<rect x="60" y="144" width="400" height="86" rx="15" fill="#F7F9F8" stroke="#D4DED8" stroke-width="1.5"/>
<text x="260" y="180" text-anchor="middle" fill="#214D43" font-size="25" font-weight="600">邮件与附件</text>
<text x="260" y="209" text-anchor="middle" fill="#65756F" font-size="18">客户来信与往来材料</text>
<rect x="540" y="144" width="400" height="86" rx="15" fill="#F7F9F8" stroke="#D4DED8" stroke-width="1.5"/>
<text x="740" y="180" text-anchor="middle" fill="#214D43" font-size="25" font-weight="600">订单与内部档案</text>
<text x="740" y="209" text-anchor="middle" fill="#65756F" font-size="18">业务背景与处理记录</text>
<path d="M 260 230 V 254 H 500 V 274" fill="none" stroke="#8A9E95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 740 230 V 254 H 500 V 274" fill="none" stroke="#8A9E95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="190" y="280" width="620" height="86" rx="15" fill="#F7F9F8" stroke="#D4DED8" stroke-width="1.5"/>
<text x="500" y="316" text-anchor="middle" fill="#214D43" font-size="25" font-weight="600">会话归并与案件时间线</text>
<text x="500" y="345" text-anchor="middle" fill="#65756F" font-size="18">整理最新诉求、历史往来与冲突信息</text>
<path d="M 500 366 V 400" fill="none" stroke="#8A9E95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="190" y="406" width="620" height="86" rx="15" fill="#EEF5F0" stroke="#A5BEB0" stroke-width="1.5"/>
<text x="500" y="442" text-anchor="middle" fill="#214D43" font-size="25" font-weight="600">AI 回复草稿</text>
<text x="500" y="471" text-anchor="middle" fill="#65756F" font-size="18">结合业务规则与案件背景起草</text>
<path d="M 500 492 V 526" fill="none" stroke="#8A9E95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="190" y="532" width="620" height="86" rx="15" fill="#EEF5F0" stroke="#A5BEB0" stroke-width="1.5"/>
<text x="500" y="568" text-anchor="middle" fill="#214D43" font-size="25" font-weight="600">人工审核与确认发送</text>
<text x="500" y="597" text-anchor="middle" fill="#65756F" font-size="18">检查对象、内容与处理方案</text>
<path d="M 500 618 V 652" fill="none" stroke="#8A9E95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="190" y="658" width="620" height="86" rx="15" fill="#F7F9F8" stroke="#D4DED8" stroke-width="1.5"/>
<text x="500" y="694" text-anchor="middle" fill="#214D43" font-size="25" font-weight="600">发送记录与邮箱对账</text>
<text x="500" y="723" text-anchor="middle" fill="#65756F" font-size="18">核对发送事实并更新本地状态</text>
<path d="M 500 744 V 778" fill="none" stroke="#8A9E95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="190" y="784" width="620" height="86" rx="15" fill="#F7F9F8" stroke="#D4DED8" stroke-width="1.5"/>
<text x="500" y="820" text-anchor="middle" fill="#214D43" font-size="25" font-weight="600">案件进度与飞书协作</text>
<text x="500" y="849" text-anchor="middle" fill="#65756F" font-size="18">异步同步业务处理记录</text>
<line x1="72" y1="916" x2="928" y2="916" stroke="#E1E7E3"/>
<text x="500" y="947" text-anchor="middle" fill="#65756F" font-size="17">邮件发送、案件状态与表格同步分别记录。</text>
</g></svg>
