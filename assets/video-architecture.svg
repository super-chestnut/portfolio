<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1020" viewBox="0 0 1180 1020" role="img" aria-labelledby="title desc">
<title id="title">AI 视频生产与交付架构 — 公开架构示意</title>
<desc id="desc">主干为产品、剧本与需求进入总控，总控派单到分镜、UGC 口播、整片生成和完整剧本四套并行原系统，使用共享能力，统一编号归档并交付飞书。参考片复刻为独立工作台：参考片与产品输入、拆段重构与审核、时间线导出，不接入总控。</desc>
