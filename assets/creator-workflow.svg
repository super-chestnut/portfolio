<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
<title id="title">达人资料与合作协作 — 流程示意</title>
<desc id="desc">达人资料与核验结果进入入库与人工判断，创建首触达草稿，经人工发送与邮件往来后，分别进入阶段判断与回复草稿、合作记录核对与更新。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#8A9E95"/></marker></defs>
<rect width="1000" height="900" fill="#FFFFFF"/>
<g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<rect x="48" y="38" width="6" height="36" rx="3" fill="#214D43"/>
<text x="72" y="66" fill="#203A33" font-size="30" font-weight="700">达人资料与合作协作</text>
<text x="72" y="103" fill="#65756F" font-size="19">资料核验、邮件草稿和合作档案分别保留业务状态</text>
<rect x="830" y="40" width="122" height="36" rx="18" fill="#EEF4F0"/>
<text x="891" y="65" text-anchor="middle" fill="#214D43" font-size="18" font-weight="600">流程示意</text>
<rect x="190" y="144" width="620" height="86" rx="15" fill="#F7F9F8" stroke="#D4DED8" stroke-width="1.5"/>
<text x="500" y="180" text-anchor="middle" fill="#214D43" font-size="25" font-weight="600">达人资料与核验结果</text>
<text x="500" y="209" text-anchor="middle" fill="#65756F" font-size="18">插件配套资料整理</text>
<path d="M 500 230 V 264" fill="none" stroke="#8A9E95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="190" y="270" width="620" height="86" rx="15" fill="#EEF5F0" stroke="#A5BEB0" stroke-width="1.5"/>
<text x="500" y="306" text-anchor="middle" fill="#214D43" font-size="25" font-weight="600">入库与人工判断</text>
<text x="500" y="335" text-anchor="middle" fill="#65756F" font-size="18">保护人工审核与许可字段</text>
<path d="M 500 356 V 390" fill="none" stroke="#8A9E95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="190" y="396" width="620" height="86" rx="15" fill="#F7F9F8" stroke="#D4DED8" stroke-width="1.5"/>
<text x="500" y="432" text-anchor="middle" fill="#214D43" font-size="25" font-weight="600">首触达草稿</text>
<text x="500" y="461" text-anchor="middle" fill="#65756F" font-size="18">供人工确认的首次建联邮件</text>
<path d="M 500 482 V 516" fill="none" stroke="#8A9E95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="190" y="522" width="620" height="86" rx="15" fill="#EEF5F0" stroke="#A5BEB0" stroke-width="1.5"/>
<text x="500" y="558" text-anchor="middle" fill="#214D43" font-size="25" font-weight="600">人工发送与邮件往来</text>
<text x="500" y="587" text-anchor="middle" fill="#65756F" font-size="18">由人确认并发送</text>
<path d="M 500 608 V 654 H 260 V 706" fill="none" stroke="#8A9E95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 500 608 V 654 H 740 V 706" fill="none" stroke="#8A9E95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="50" y="712" width="420" height="86" rx="15" fill="#F7F9F8" stroke="#D4DED8" stroke-width="1.5"/>
<text x="260" y="748" text-anchor="middle" fill="#214D43" font-size="25" font-weight="600">阶段判断与回复草稿</text>
<text x="260" y="777" text-anchor="middle" fill="#65756F" font-size="18">结合完整线程与图文证据</text>
<rect x="530" y="712" width="420" height="86" rx="15" fill="#F7F9F8" stroke="#D4DED8" stroke-width="1.5"/>
<text x="740" y="748" text-anchor="middle" fill="#214D43" font-size="25" font-weight="600">合作记录核对与更新</text>
<text x="740" y="777" text-anchor="middle" fill="#65756F" font-size="18">核对已发生事实与合作轮次</text>
<line x1="72" y1="846" x2="928" y2="846" stroke="#E1E7E3"/>
<text x="500" y="877" text-anchor="middle" fill="#65756F" font-size="17">回复辅助与档案维护是不同模块，可按实际流程分别交付。</text>
</g></svg>
